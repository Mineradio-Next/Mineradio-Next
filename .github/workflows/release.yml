name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match package.json $packageVersion"
          }

      - name: Test
        run: npm test

      - name: CI project checks
        run: npm run check:ci

      - name: Dependency audit
        run: npm run security:audit

      - name: Verify release metadata
        run: npm run release:verify

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Create checksums
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm run release:checksums
          $notes = "docs/RELEASE_NOTES_v$packageVersion.md"
          if (Test-Path -LiteralPath $notes) {
            Copy-Item -LiteralPath $notes -Destination dist/RELEASE_NOTES.md
          } else {
            @(
              "# Mineradio Next v$packageVersion",
              '',
              'See the repository history and README for this release.'
            ) | Set-Content -LiteralPath dist/RELEASE_NOTES.md -Encoding utf8
          }

      - name: Verify release artifacts
        run: npm run release:verify -- --artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mineradio-Next-Windows-${{ github.ref_name }}
          path: |
            dist/*-Setup.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          name: Mineradio Next ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*-Setup.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
