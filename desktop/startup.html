<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio Next</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.92);
      background: #010304;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      user-select: none;
    }
    .boot {
      display: grid;
      justify-items: center;
      gap: 15px;
      opacity: 1;
      transform: translateY(-2vh) scale(1);
      transition:
        opacity 320ms cubic-bezier(.4, 0, 1, 1),
        transform 420ms cubic-bezier(.4, 0, .2, 1);
      will-change: opacity, transform;
    }
    .is-leaving .boot {
      opacity: 0;
      transform: translateY(calc(-2vh - 5px)) scale(.992);
    }
    .name { font-size: 26px; font-weight: 680; letter-spacing: -.035em; color: #f8f8f2; }
    .name span { color: #8fe4d2; font-size: .62em; font-weight: 520; margin-left: 7px; letter-spacing: .08em; }
    .status { color: rgba(255,255,255,.48); font-size: 12px; letter-spacing: .08em; }
    .dots { display: flex; gap: 7px; height: 8px; }
    .dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      animation: pulse 1.05s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .14s; }
    .dots i:nth-child(3) { animation-delay: .28s; }
    @keyframes pulse {
      0%, 70%, 100% { opacity: .2; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot { transition-duration: 120ms; transform: translateY(-2vh); }
      .dots i { animation: none; opacity: .55; }
    }
  </style>
</head>
<body>
  <main class="boot" role="status" aria-live="polite">
    <div class="name">Mineradio<span>Next</span></div>
    <div class="status">正在进入播放器</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
